[package]
name = "nyks-consensus"
description = "consensus types of nyks"
authors = ["Triton Software"]
version = "0.8.0"
edition = "2024"
license = "Apache-2.0"

repository = "https://github.com/Nyksnet/nyksnode/"

[dependencies]
itertools = "0.14"
tasm-lib = "9.0.0"
get-size2 = { version = "0.9", features = ["derive"] }
anyhow = { version = "1.0", features = ["backtrace"] }
serde = { version = "1.0", features = ["derive"] }
rand = "0.10"
num-rational = "0.4"
num-traits = "0.2"
tracing = "0.1"
chrono = "^0.4.34"
strum = { version = "0.27.0", features = ["derive"] }
arbitrary = { version = "1.4.1", features = ["derive"], optional = true }
thiserror = "1.0.65"
num-bigint = { version = "0.4", features = ["serde"] }
proptest = { version = "1.7", optional = true }
proptest-arbitrary-interop = { version = "0.1", optional = true }
regex = "1.11.0"
bincode = "1.3"
readonly = "0.2.12"
field_count = "0.1"
serde_arrays = "0.2"
rayon = "1.10"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "process", "signal", "sync", "time", "tracing", "rt"] }

[dev-dependencies]
arbitrary = { version = "1.4.1", features = ["derive"] }
proptest = { version = "1.7" }
proptest-arbitrary-interop = { version = "0.1" }

[lints]
workspace = true

[features]
test-helpers = []