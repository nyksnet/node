[package]
name = "nyks-wallet-core"
description = "wallet internals of nyks"
authors = ["Nyksdevs"]
version = "0.8.0"
edition = "2024"
license = "Apache-2.0"

repository = "https://github.com/Nyksnet/nyksnode/"

[dependencies]
nyks-consensus = { version = "0.8.0", path = "../../consensus" }
nyks-standards = { version = "0.8.0", path = "../../standards" }
tracing = "0.1.41"
num-traits = "0.2.19"
serde = "1.0.228"
itertools = "0.14.0"
thiserror = "1.0.65"
rand = "0.10"
zeroize = "1.8.1"
tiny-bip39 = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.45.1", features = ["full", "tracing"] }

[dev-dependencies]

[lints]
workspace = true
