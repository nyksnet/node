[package]
name = "nyks-rpc-client"
description = "library for interacting with nyks's JSON-RPC"
authors = ["Triton Software"]
version = "0.8.0"
edition = "2024"
license = "Apache-2.0"

repository = "https://github.com/Nyksnet/nyksnode/"

[dependencies]
reqwest = { version = "0.12.24", default-features = false, features = [
    "json",
    "default-tls",
    "system-proxy",
] }
serde_json = "1.0"
nyks-rpc-core = { version = "0.8.0", path = "../core" }
async-trait = "0.1.83"

[dev-dependencies]
itertools = "0.14"
rand = "0.10"
tokio = { version = "1.47", features = ["fs", "io-util", "sync", "macros", "time", "tracing"] }
num-traits = "0.2"

[lints]
workspace = true
