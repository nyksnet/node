[package]
name = "nyks-rpc-core"
description = "types for interacting with nyks's JSON-RPC"
authors = ["Triton Software"]
version = "0.8.0"
edition = "2024"
license = "Apache-2.0"

repository = "https://github.com/Nyksnet/nyksnode/"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0.65"
nyks-consensus = { version = "0.8.0", path = "../../consensus" }
nyks-standards = { version = "0.8.0", path = "../../standards" }
tasm-lib = "9.0.0"
hex = "0.4.3"
serde_tuple = "1.1.3"
serde_arrays = "0.2"
num-bigint = { version = "0.4", features = ["serde"] }
nyks-rpc-macros = { version = "0.8.0", path = "../macros" }
async-trait = "0.1.83"
strum = { version = "0.27.0", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
