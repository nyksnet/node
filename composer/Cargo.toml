[package]
name = "nyks-composer"
description = "architect of nyks blocks"
authors = ["Nyksdevs"]
version = "0.8.0"
edition = "2024"

license = "Apache-2.0"

repository = "https://github.com/Nyksnet/nyksnode/"

[dependencies]
nyks-consensus = { version = "0.8.0", path = "../consensus" }
nyks-standards = { version = "0.8.0", path = "../standards" }
nyks-rpc-client = { version = "0.8.0", path = "../rpc/client" }
nyks-wallet-core = { version = "0.8.0", path = "../wallet/core" }
nyks-prover = { version = "0.8.0", path = "../prover" }
anyhow = "1.0.98"
tokio = { version = "1.45.1", features = ["full", "tracing"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
clap = { version = "4.5.54", features = ["derive"] }
num-traits = "0.2.19"
rand = "0.10"
thiserror = "1.0.65"

[dev-dependencies]

[lints]
workspace = true
