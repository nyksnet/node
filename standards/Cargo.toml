[package]
name = "nyks-standards"
description = "standard types of nyks"
authors = ["Triton Software"]
version = "0.8.0"
edition = "2024"
license = "Apache-2.0"

repository = "https://github.com/Nyksnet/nyksnode/"

[dependencies]

aead = { version = "0.5", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
nyks-consensus = { version = "0.8.0", path = "../consensus" }
aes-gcm = "0.10"
anyhow = { version = "1.0", features = ["backtrace"] }
bech32 = ">=0.9, <0.10"
zeroize = "1.8.1"
sha3 = "0.10.8"
bincode = "1.3"
thiserror = "1.0.65"
num-traits = "0.2"
tiny-bip39 = "1.0"
rand = "0.10"

[dev-dependencies]

nyks-consensus = { version = "0.8.0", path = "../consensus", features = ["test-helpers"]  }

[lints]
workspace = true
